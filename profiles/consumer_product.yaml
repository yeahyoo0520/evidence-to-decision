  "stage_options": ["Unknown", "Considering", "Waiting for Launch", "Purchased", "Using", "Returned", "Replacing", "Repurchasing"],
  "review_guidance": "Use risk-based review: low and medium are preliminary by default; high risk is mandatory review.",
  "insight_questions": ["Which product themes recur?", "Which verified evidence supports an actionable opportunity?", "Where are information or experience gaps visible?"],
  "report_sections": ["Research Setup", "Review Workload", "Confirmed Findings", "Preliminary Insights", "Insight Review Queue"],
