  "primary_categories": ["Product Praise", "Product Concern", "Product Question", "Purchase Question", "Usage Scenario", "Competitor Comparison", "Purchase Intent", "Feature Request", "After-sales Issue", "Other"],
  "category_definitions": {
    "Product Praise": "Overall endorsement, satisfaction, or positive product experience.",
    "Product Concern": "A product problem, dissatisfaction, risk, or negative experience.",
    "Product Question": "A question about product capability, operation, compatibility, or performance.",
    "Purchase Question": "A question about price, availability, selection, or purchase channel.",
    "Usage Scenario": "A concrete situation in which the product is or may be used.",
    "Competitor Comparison": "An explicit comparison, preference, or switch between alternatives.",
    "Purchase Intent": "Current consideration, waiting, or explicit intent to buy.",
    "Feature Request": "A requested feature, design change, or improvement.",
    "After-sales Issue": "A service, warranty, replacement, repair, or support issue for the focal product.",
    "Other": "Content that does not fit the product taxonomy or is about the creator/video."
  },
  "secondary_category_guidance": "Preserve genuine subordinate intents without repeating the primary category.",
